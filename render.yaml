services:
  - type: web
    name: sowon-dream-plaza
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_ADMIN_ALLOWLIST
        value: 푸르미르
      - key: DATABASE_URL
        fromDatabase:
          name: sowon-dream-plaza-db
          property: connectionString
      # Cloudflare R2 — 사진 스토리지 (private bucket, Phase A Safety)
      # 실제 값은 Render 대시보드 Environment에서 수동 설정
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

databases:
  - name: sowon-dream-plaza-db
    plan: free
    region: oregon
    databaseName: sowon_plaza
    user: sowon_plaza_admin
